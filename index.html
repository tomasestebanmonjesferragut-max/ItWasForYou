<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestros Momentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fffaf7;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-pink: #ff7675;
            --accent-gold: #ffc46b;
            --accent-lavender: #a29bfe;
            --black: #000000;
            --font-display: 'Cormorant Garamond', 'Segoe UI', serif;
            --font-body: 'Poppins', 'Segoe UI', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: var(--font-body);
            overflow: hidden;
            height: 100%;
        }

        /* ---------- Fondo luminoso (aurora) ---------- */
        #aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            mix-blend-mode: multiply;
            animation: drift 22s ease-in-out infinite;
        }

        .blob1 {
            width: 55vw; height: 55vw;
            background: radial-gradient(circle, var(--accent-pink), transparent 70%);
            top: -15%; left: -10%;
            animation-duration: 26s;
        }

        .blob2 {
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, var(--accent-gold), transparent 70%);
            bottom: -20%; right: -15%;
            animation-duration: 32s;
            animation-delay: -6s;
        }

        .blob3 {
            width: 45vw; height: 45vw;
            background: radial-gradient(circle, var(--accent-lavender), transparent 70%);
            top: 30%; right: 10%;
            animation-duration: 20s;
            animation-delay: -12s;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(6vw, 4vh) scale(1.08); }
            66% { transform: translate(-4vw, 6vh) scale(0.95); }
        }

        .sparkle {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px 2px rgba(255,255,255,0.9);
            animation: twinkle var(--td) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.6); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        #bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            opacity: 0;
            user-select: none;
            z-index: 11;
            animation: float-up var(--d) linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) scale(0.8) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        #gallery {
            height: 100vh;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 1;
        }

        .section {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .section.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .photo-frame {
            position: relative;
            padding: 14px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px rgba(45, 52, 54, 0.1);
            transition: box-shadow 1.2s ease, transform 1.2s ease;
            overflow: hidden;
        }

        .section.active .photo-frame {
            box-shadow: 0 0 55px 8px rgba(255, 196, 107, 0.3), 0 25px 55px rgba(45, 52, 54, 0.16);
        }

        img, video {
            display: block;
            max-width: 100%;
            max-height: 72vh;
            border-radius: 16px;
            background: #fff;
            object-fit: contain;
        }

        img {
            transform: scale(1.03);
            transition: transform 9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section.active img {
            transform: scale(1.09);
        }

        .cover {
            text-align: center;
            padding: 40px;
            max-width: 520px;
        }

        .cover h1 {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 3rem;
            letter-spacing: 0.5px;
            color: var(--text-main);
            margin-bottom: 14px;
            text-shadow: 0 0 25px rgba(255, 196, 107, 0.45);
        }

        .cover .subtitle {
            font-family: var(--font-display);
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.7;
            font-size: 1.3rem;
        }

        .cover .scroll-hint {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--accent-pink);
            letter-spacing: 2px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        .farewell {
            text-align: center;
            padding: 44px 36px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            max-width: 520px;
            max-height: 82vh;
            overflow-y: auto;
            box-shadow: 0 0 60px rgba(255, 118, 117, 0.25);
        }

        .farewell p {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        .section.active .farewell p {
            opacity: 1;
            transform: translateY(0);
        }

        .section.active .farewell p:nth-of-type(1) { transition-delay: 0.2s; }
        .section.active .farewell p:nth-of-type(2) { transition-delay: 0.6s; }
        .section.active .farewell p:nth-of-type(3) { transition-delay: 1.0s; }
        .section.active .farewell p:nth-of-type(4) { transition-delay: 1.4s; }
        .section.active .farewell p:nth-of-type(5) { transition-delay: 1.8s; }

        .heart-beat {
            font-size: 4rem;
            color: var(--accent-pink);
            animation: beat 1.5s infinite;
            display: inline-block;
            filter: drop-shadow(0 0 12px rgba(255, 118, 117, 0.6));
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .farewell h2 { font-family: var(--font-display); font-weight: 600; font-size: 2.3rem; color: var(--text-main); }
        .farewell p { font-family: var(--font-display); font-size: 1.15rem; font-style: italic; color: var(--text-muted); line-height: 1.7; }

        .youtube-link {
            display: block;
            margin-top: 30px;
            color: var(--accent-pink);
            text-decoration: none;
            font-size: 0.85rem;
            word-break: break-all;
            opacity: 0.8;
        }

        /* ---------- Barra de progreso ---------- */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-gold));
            z-index: 200;
            transition: width 0.15s ease-out;
            box-shadow: 0 0 8px rgba(255, 118, 117, 0.6);
        }

        /* ---------- Controles ---------- */
        .control-btn {
            position: fixed;
            bottom: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--accent-pink);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 100;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        #auto-scroll-btn { right: 25px; }
        #music-btn { right: 82px; background-color: var(--accent-lavender); }

        /* ---------- Pantalla de bienvenida ---------- */
        #welcome-screen {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: linear-gradient(135deg, #fff5f5, #fff9ec);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #welcome-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #welcome-screen .glow-heart {
            font-size: 3.5rem;
            animation: beat 1.6s infinite;
            filter: drop-shadow(0 0 20px rgba(255, 118, 117, 0.7));
            margin-bottom: 10px;
        }

        #welcome-screen h1 {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 2.1rem;
            color: var(--text-main);
            margin: 10px 0;
        }

        #welcome-screen p {
            font-family: var(--font-display);
            font-size: 1.15rem;
            color: var(--text-muted);
            font-style: italic;
            max-width: 340px;
        }

        #enter-btn {
            margin-top: 25px;
            padding: 14px 34px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-gold));
            color: white;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 118, 117, 0.4);
            animation: pulse-btn 2s infinite;
        }

        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #yt-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="aurora">
        <div class="aurora-blob blob1"></div>
        <div class="aurora-blob blob2"></div>
        <div class="aurora-blob blob3"></div>
    </div>

    <div id="progress-bar"></div>
    <div id="bg-decorations"></div>
    <div id="gallery"></div>

    <div id="welcome-screen">
        <div class="glow-heart">❤️</div>
        <h1>Un pequeño regalo para ti</h1>
        <p>Ya está sonando nuestra canción de fondo. Toca para comenzar.</p>
        <button id="enter-btn">Toca para comenzar ✨</button>
    </div>

    <div id="yt-player-container"><div id="yt-player"></div></div>

    <button id="music-btn" title="Música">🔇</button>
    <button id="auto-scroll-btn" title="Reproducción automática">▶️</button>

    <script>
        const fotos = [
            { src: "foto1.jpg" },
            { src: "foto2.jpg" },
            { src: "foto3.jpg" },
            { src: "foto4.jpg" },
            { src: "foto5.jpg" },
            { src: "foto6.jpg" },
            { src: "foto7.jpg" },
            { src: "foto8.jpg" },
            { src: "foto9.jpg" },
            { src: "foto10.jpg" },
            { src: "foto11.jpg" },
            { src: "foto12.jpg" },
            { src: "foto13.jpg" },
            { src: "foto14.jpg" },
            { src: "foto15.jpg" }
        ];
        const videoFinal = "video1.mp4";
        const folder = "Photos/";

        const gallery = document.getElementById('gallery');
        const bg = document.getElementById('bg-decorations');
        const aurora = document.getElementById('aurora');

        function initBackground() {
            const icons = ['✨', '❤️', '🌸', '🤍', '☁️'];
            for (let i = 0; i < 20; i++) {
                const div = document.createElement('div');
                div.className = 'particle';
                div.innerText = icons[Math.floor(Math.random() * icons.length)];
                div.style.left = Math.random() * 100 + 'vw';
                div.style.fontSize = (Math.random() * 20 + 15) + 'px';
                div.style.setProperty('--d', (Math.random() * 10 + 10) + 's');
                div.style.animationDelay = (Math.random() * -20) + 's';
                bg.appendChild(div);
            }
        }

        function initSparkles() {
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                const size = Math.random() * 3 + 1;
                s.style.width = size + 'px';
                s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 100 + 'vh';
                s.style.setProperty('--td', (Math.random() * 4 + 2) + 's');
                s.style.animationDelay = (Math.random() * -6) + 's';
                aurora.appendChild(s);
            }
        }

        // Portada
        const coverSec = document.createElement('div');
        coverSec.className = 'section';
        coverSec.innerHTML = `
            <div class="cover">
                <h1>Nuestros Momentos</h1>
                <div class="subtitle">Un pequeño repaso de todo lo que vivimos juntos, antes de decirnos, por ahora, hasta luego.</div>
                <div class="scroll-hint">DESLIZA PARA VER ↓</div>
            </div>
        `;
        gallery.appendChild(coverSec);

        fotos.forEach(foto => {
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `
                <div class="photo-frame">
                    <img src="${folder}${foto.src}" alt="Recuerdo">
                </div>
            `;
            gallery.appendChild(sec);
        });

        const vidSec = document.createElement('div');
        vidSec.className = 'section';
        vidSec.innerHTML = `
            <div class="photo-frame">
                <video controls playsinline>
                    <source src="${folder}${videoFinal}" type="video/mp4">
                </video>
            </div>
        `;
        gallery.appendChild(vidSec);

        const msgSec = document.createElement('div');
        msgSec.className = 'section';
        msgSec.innerHTML = `
            <div class="farewell">
                <div class="heart-beat">❤️</div>
                <h2>Gracias por todo</h2>
                <p>"Cada una de estas imágenes guarda un pedacito de nuestra historia. Gracias por estar ahí cuando estuve de malas, en las buenas y en las peores, y por apoyarme en todo.</p>
                <p>Este año creí que podíamos volver a hablar como lo hacíamos en el liceo; esa fue una de las mejores épocas que tuve junto a ti.</p>
                <p>Todavía me acuerdo de esa vuelta del cerro, agotados los dos, y tú quedándote dormida en mi hombro en la micro. Fue un momento simple, pero de esos que se quedan grabados.</p>
                <p>Sabes que siempre intenté hablar contigo lo más que pude, pero después de tanto buscarte, ya me había cansado.</p>
                <p>No hay palabras que puedan expresar lo mucho que te aprecio; no sabes cuánto me duele esto, pero es lo mejor.</p>
                <p>Solo espero que en el futuro nos veamos de vuelta y podamos empezar de cero... pero de una mejor forma."</p>
                <div style="letter-spacing: 3px; font-size: 1.0rem; color: #000000; margin-top: 20px;"> Con todo mi amor, tu siempre "amigo".</div>
                <div style="letter-spacing: 3px; font-size: 1.5rem; color: #ff7675; margin-top: 20px;"> SIEMPRE ESTARE CUANDO ME NECESITES</div>
                <div style="letter-spacing: 3px; font-size: 1.5rem; color: #ff7675; margin-top: 20px;"> NO LO DUDES</div>
                <a href="https://www.youtube.com/watch?v=7-wUAhxAIgU" target="_blank" class="youtube-link">
                    Destello - Kidd Voodoo (la canción de fondo)
                </a>
            </div>
        `;
        gallery.appendChild(msgSec);

        const sections = () => document.querySelectorAll('.section');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.3 });

        sections().forEach(s => observer.observe(s));
        initBackground();
        initSparkles();

        // Barra de progreso de scroll
        const progressBar = document.getElementById('progress-bar');
        gallery.addEventListener('scroll', () => {
            const max = gallery.scrollHeight - gallery.clientHeight;
            const pct = max > 0 ? (gallery.scrollTop / max) * 100 : 0;
            progressBar.style.width = pct + '%';
        });

        // Lógica de Auto-Scroll
        const autoScrollBtn = document.getElementById('auto-scroll-btn');
        let autoScrollInterval;
        let isAutoScrolling = false;

        autoScrollBtn.addEventListener('click', () => {
            isAutoScrolling = !isAutoScrolling;

            if (isAutoScrolling) {
                gallery.style.scrollSnapType = 'none';
                autoScrollBtn.innerHTML = '⏸️';

                autoScrollInterval = setInterval(() => {
                    gallery.scrollTop += 6;

                    if (gallery.scrollTop + gallery.clientHeight >= gallery.scrollHeight - 5) {
                        stopAutoScroll();
                    }
                }, 16);
            } else {
                stopAutoScroll();
            }
        });

        function stopAutoScroll() {
            clearInterval(autoScrollInterval);
            isAutoScrolling = false;
            autoScrollBtn.innerHTML = '▶️';
            gallery.style.scrollSnapType = 'y mandatory';
        }

        // ---------- Música de fondo (YouTube: Destello - Kidd Voodoo) ----------
        // Los navegadores bloquean el audio con sonido hasta que hay una
        // interacción del usuario. Por eso arrancamos en silencio apenas
        // carga la página y activamos el sonido en el primer toque/scroll,
        // que en la práctica ocurre casi al instante (ej: tocar "comenzar").
        let ytPlayer;
        let ytReady = false;
        let isMuted = true;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        window.onYouTubeIframeAPIReady = function () {
            ytPlayer = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: '7-wUAhxAIgU',
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 0,
                    loop: 1,
                    playlist: '7-wUAhxAIgU'
                },
                events: {
                    onReady: (e) => {
                        ytReady = true;
                        e.target.playVideo();
                    }
                }
            });
        };

        function unlockSound() {
            if (!ytReady || !isMuted) return;
            ytPlayer.unMute();
            ytPlayer.setVolume(100);
            if (ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo();
            isMuted = false;
            musicBtn.innerHTML = '🎵';
        }

        ['click', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
            document.addEventListener(evt, unlockSound, { once: true, passive: true });
        });

        const musicBtn = document.getElementById('music-btn');
        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!ytReady) return;
            if (isMuted) {
                unlockSound();
            } else {
                ytPlayer.mute();
                isMuted = true;
                musicBtn.innerHTML = '🔇';
            }
        });

        // ---------- Pantalla de bienvenida ----------
        const welcomeScreen = document.getElementById('welcome-screen');
        const enterBtn = document.getElementById('enter-btn');

        enterBtn.addEventListener('click', () => {
            welcomeScreen.classList.add('hide');
        });
    </script>
</body>
</html>
